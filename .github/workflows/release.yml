name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make lint test
        env:
          CGO_ENABLED: "0"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
      # The apt and yum repositories are rebuilt by packages.yml from the
      # release assets; a workflow_dispatch is the one event a workflow
      # token may trigger.
      - name: Rebuild the package repositories
        run: gh workflow run packages.yml -f tag="$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
