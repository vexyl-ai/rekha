name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    env:
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
      CLOUDSMITH_REPO: vexyl-ai/rekha
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make lint test
        env:
          CGO_ENABLED: "0"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
      # Linux package repositories: apt, dnf and apk users add the Cloudsmith
      # repo once and get every release. Skipped when the key is not set.
      - name: Publish packages to Cloudsmith
        if: env.CLOUDSMITH_API_KEY != ''
        run: |
          pipx install cloudsmith-cli
          for f in dist/*.deb; do cloudsmith push deb --republish "$CLOUDSMITH_REPO/any-distro/any-version" "$f"; done
          for f in dist/*.rpm; do cloudsmith push rpm --republish "$CLOUDSMITH_REPO/any-distro/any-version" "$f"; done
          for f in dist/*.apk; do cloudsmith push alpine --republish "$CLOUDSMITH_REPO/alpine/any-version" "$f"; done
